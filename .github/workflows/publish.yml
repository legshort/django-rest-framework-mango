name: Publish

on:
  push:
    tags:
      - '**'
  # Manual runs publish a dev release to TestPyPI, so the real version stays untouched.
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    # Trusted Publishing: PyPI authenticates this workflow through OIDC, no token needed.
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'

      # TestPyPI rejects a version it already holds, so every dry run gets a fresh one.
      - name: Stamp a dev version
        if: github.event_name == 'workflow_dispatch'
        run: uv version "$(uv version --short).dev${{ github.run_number }}"

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Publish package to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish package to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
