name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Django versions are a tox factor, so no exclude block is needed here:
      # 3.10/3.11 run Django 5.2 only, 3.12+ run Django 5.2 and 6.0.
      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uvx --with tox-uv tox -f "py${PYTHON_VERSION//./}"

  typecheck:
    name: mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'

      - run: uvx --with tox-uv tox -e mypy
