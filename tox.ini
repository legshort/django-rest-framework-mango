; ponytail: no dj61 env. DRF 3.17.2 breaks on Django 6.1 (cc_delim_re removed from
; django.utils.cache); the fix is merged on DRF main but unreleased. When DRF ships it:
; add dj60 -> dj{60,61} below and drop the `django<6.1` cap in pyproject's dev group.

[tox]
requires = tox-uv>=1.36
env_list = py3{10,11}-dj52, py3{12,13,14}-dj{52,60}, mypy

[testenv]
dependency_groups = dev
deps =
    dj52: django~=5.2.0
    dj60: django~=6.0.0
commands = pytest {posargs}

[testenv:mypy]
dependency_groups = dev
commands = mypy
